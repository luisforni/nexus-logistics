global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'nexus-backend'
    static_configs:
      - targets: ['nexus-backend:8080']
    metrics_path: '/metrics'

  - job_name: 'nexus-optimizer'
    static_configs:
      - targets: ['nexus-optimizer:9090']
