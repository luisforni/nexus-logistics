name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write
  id-token: write  # OIDC for cloud auth

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Build & push images ───────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-24.04
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}/nexus-backend
            ${{ env.IMAGE_PREFIX }}/nexus-optimizer
            ${{ env.IMAGE_PREFIX }}/nexus-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/nexus-backend:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/nexus-backend:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/nexus-backend:cache,mode=max
          provenance: true
          sbom: true

      - name: Build & push optimizer
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-logistics-optimizer
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/nexus-optimizer:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/nexus-optimizer:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/nexus-optimizer:cache,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/nexus-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/nexus-frontend:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/nexus-frontend:cache,mode=max

  # ── Deploy to staging ────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-24.04
    needs: build-push
    environment:
      name: staging
      url: https://staging.nexus-logistics.com
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to staging cluster
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          kubectl set image deployment/nexus-backend \
            backend=${{ env.IMAGE_PREFIX }}/nexus-backend:${IMAGE_TAG} \
            -n nexus --record

          kubectl set image deployment/nexus-optimizer \
            optimizer=${{ env.IMAGE_PREFIX }}/nexus-optimizer:${IMAGE_TAG} \
            -n nexus --record

          kubectl set image deployment/nexus-frontend \
            frontend=${{ env.IMAGE_PREFIX }}/nexus-frontend:${IMAGE_TAG} \
            -n nexus --record

          kubectl rollout status deployment/nexus-backend -n nexus --timeout=5m
          kubectl rollout status deployment/nexus-optimizer -n nexus --timeout=5m
          kubectl rollout status deployment/nexus-frontend -n nexus --timeout=5m

      - name: Smoke test staging
        run: |
          sleep 10
          curl -sf https://staging.nexus-logistics.com/health | grep '"status":"ok"'

  # ── Deploy to production ─────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-24.04
    needs: [build-push, deploy-staging]
    environment:
      name: production
      url: https://app.nexus-logistics.com
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.PROD_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rolling deploy to production
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          for svc in nexus-backend nexus-optimizer nexus-frontend; do
            image_name="${{ env.IMAGE_PREFIX }}/${svc}:${IMAGE_TAG}"
            kubectl set image deployment/${svc} ${svc##nexus-}=${image_name} -n nexus
            kubectl rollout status deployment/${svc} -n nexus --timeout=10m
          done

      - name: Production smoke test
        run: |
          sleep 15
          curl -sf https://api.nexus-logistics.com/health | grep '"status":"ok"'
          curl -sf https://app.nexus-logistics.com/health | grep 'ok'

      - name: Notify on success
        if: success()
        run: |
          echo "::notice title=Production Deploy::Version ${{ needs.build-push.outputs.image-tag }} deployed successfully."
