[package]
name = "nexus-optimizer"
version = "1.0.0"
edition = "2021"
authors = ["Nexus Logistics Team"]
description = "Route optimization and AI analytics service"

[[bin]]
name = "nexus-optimizer"
path = "src/main.rs"

[dependencies]
axum            = { version = "0.7", features = ["json", "tracing"] }
tokio           = { version = "1",   features = ["full"] }
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"
tower           = { version = "0.4", features = ["limit", "timeout"] }
tower-http      = { version = "0.5", features = ["cors", "trace", "request-id", "compression-gzip"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid            = { version = "1",   features = ["v4", "serde"] }
thiserror       = "1"
anyhow          = "1"
config          = "0.14"
reqwest         = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ordered-float   = { version = "4",  features = ["serde"] }

[dev-dependencies]
axum-test      = "0.5"
tokio-test     = "0.4"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
